<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Слова</title>
  <meta name="theme-color" content="#F7F8FA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Слова">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/inter-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app" x-data="app" x-cloak>

    <!-- Learn (spec §15–27) -->
    <template x-if="view === 'learn'">
      <div class="screen">
        <header class="header">
          <h1 class="header-title">Слова</h1>
          <button class="btn-pill" type="button" @click="view = 'progress'">Прогресс</button>
        </header>

        <p class="empty" x-show="!q" x-text="error || 'Загрузка…'"></p>

        <template x-if="q">
          <div class="screen">
            <section class="word-area">
              <p class="word" x-text="q.prompt" :lang="q.direction === 'sr-ru' ? 'sr-Latn' : 'ru'"></p>
              <div class="pronunciation" x-text="q.direction === 'sr-ru' ? q.card.pronunciation : ''"></div>
              <p class="example" x-text="q.direction === 'sr-ru' ? q.example.sr : q.example.ru"></p>
            </section>

            <section class="feedback" aria-live="polite">
              <template x-if="fb">
                <div>
                  <template x-if="fb.title">
                    <div class="fb-title" :class="fb.titleClass" x-text="fb.title"></div>
                  </template>
                  <template x-if="fb.line">
                    <div class="fb-line" x-text="fb.line"></div>
                  </template>
                  <div class="fb-example" x-text="fb.example"></div>
                </div>
              </template>
            </section>

            <section class="panel">
              <div class="answers">
                <template x-for="(option, i) in q.options" :key="i">
                  <button class="answer" type="button" :class="answerClass(i)" :disabled="locked" @click="choose(i)">
                    <span x-text="option"></span>
                    <template x-if="answerClass(i) === 'is-correct'">
                      <span><span class="visually-hidden">верно</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>
                    </template>
                    <template x-if="answerClass(i) === 'is-wrong'">
                      <span><span class="visually-hidden">ошибка</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></span>
                    </template>
                  </button>
                </template>
              </div>
              <!-- One slot: Уже знаю / Не знаю before answering, Дальше after. Both stay in layout (visibility only). -->
              <div class="actions">
                <div class="actions-row" :class="locked && 'is-hidden'">
                  <button class="btn-main is-soft" type="button" @click="markKnown()">Уже знаю</button>
                  <button class="btn-main is-soft" type="button" @click="markUnknown()">Не знаю</button>
                </div>
                <button class="btn-main" type="button" :class="!locked && 'is-hidden'" @click="tapGuarded() || next()">Дальше</button>
              </div>
            </section>
          </div>
        </template>
      </div>
    </template>

    <!-- Progress + settings (spec §28–30) -->
    <template x-if="view === 'progress'">
      <div class="screen settings">
        <header class="header header-back">
          <button class="btn-link" type="button" @click="view = 'learn'">‹ К словам</button>
          <span class="header-center">Прогресс</span>
        </header>

        <h1 class="page-title">Прогресс и настройки</h1>

        <section class="card metrics">
          <div class="metric">
            <div class="metric-label">Сегодня</div>
            <div class="metric-value" x-text="summary.today.answered"></div>
            <div class="metric-label">ответов</div>
          </div>
          <div class="metric">
            <div class="metric-label">Точность</div>
            <div class="metric-value" x-text="summary.today.answered ? Math.round(100 * summary.today.correct / summary.today.answered) + '%' : '—'"></div>
            <div class="metric-label" x-text="`${summary.today.correct} / ${summary.today.answered}`"></div>
          </div>
          <div class="metric">
            <div class="metric-label">Новых</div>
            <div class="metric-value" x-text="summary.today.newWords"></div>
            <div class="metric-label">слов</div>
          </div>
        </section>

        <section class="card">
          <h2 class="card-title">Последние 30 дней</h2>
          <div class="card-note" x-text="`Сегодня ${summary.today.answered} · вчера ${summary.yesterday.answered}`"></div>
          <div class="bars" aria-hidden="true">
            <template x-for="day in summary.days" :key="day.date">
              <span class="bar" :class="{ 'is-empty': !day.answered }" :style="day.answered ? `height: ${Math.max(6, 72 * day.answered / maxDay)}px` : ''" :title="`${day.date}: ${day.answered}`"></span>
            </template>
          </div>
        </section>

        <section class="card">
          <h2 class="card-title">Направление</h2>
          <div class="segmented" role="group" aria-label="Направление">
            <template x-for="[value, label] in [['mixed', 'Смешанный'], ['sr-ru', 'SR → RU'], ['ru-sr', 'RU → SR']]" :key="value">
              <button type="button" :aria-pressed="settings.direction === value" @click="setDirection(value)" x-text="label"></button>
            </template>
          </div>
          <p class="card-note">Смешанный адаптивно чередует оба направления.</p>
        </section>

        <section class="card">
          <h2 class="card-title">Новые слова</h2>
          <div class="segmented" role="group" aria-label="Новые слова">
            <template x-for="[value, label] in [['less', 'Меньше'], ['normal', 'Обычно'], ['more', 'Больше']]" :key="value">
              <button type="button" :aria-pressed="settings.newWords === value" @click="setNewWords(value)" x-text="label"></button>
            </template>
          </div>
          <p class="card-note">Определяет, как часто среди повторений появляются новые слова.</p>
        </section>

        <section class="card">
          <h2 class="card-title">Обновление</h2>
          <p class="card-note" x-text="'Версия ' + (version ? `${version.slice(0, 16).replace('T', ' ')} UTC` : 'dev')"></p>
          <button class="btn-soft" type="button" :disabled="updating" @click="update()">Обновить приложение и карточки</button>
          <p class="card-note" role="status" x-text="updateMessage"></p>
        </section>

        <button class="btn-danger" type="button" @click="reset()">Сбросить прогресс</button>
      </div>
    </template>

  </div>
</body>
</html>
